<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarcaLive Widget</title>

    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles_final.css?v=2">
    <link rel="stylesheet" href="assets/css/layout-fixes.css?v=2">

    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Widget specific overrides */
        #widget-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .glass-premium {
            margin: 0;
            border-radius: 20px;
            /* Slight rounding for the widget interior if needed, or 0 if filling */
            height: 100%;
            border: none;
            /* Liquid Glass Override for Widget */
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: none;
            /* Let the container handle shadow or minimal */
        }

        #widget-container {
            padding: 10px;
            /* Create space for the floaty liquid drop effect */
        }

        /* Adjust sizing for widget context */
        .match-teams-score {
            transform: scale(0.9);
            transform-origin: center;
        }
    </style>
</head>

<body>
    <div id="widget-container">
        <div class="glass-premium p-4 relative overflow-hidden group h-full flex flex-col justify-center">
            <div id="next-match-container" class="w-full flex items-center justify-center relative">
                <!-- Loading Skeleton -->
                <div class="flex flex-col items-center w-full animate-pulse">
                    <div class="h-6 w-24 bg-white/10 rounded-full mb-6"></div>
                    <div class="flex flex-row items-center gap-8 w-full justify-center">
                        <div class="w-16 h-16 bg-white/10 rounded-2xl"></div>
                        <div class="h-8 w-16 bg-white/10 rounded"></div>
                        <div class="w-16 h-16 bg-white/10 rounded-2xl"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { barcaAPI } from './assets/js/core/api.js';
        import { renderNextMatch } from './assets/js/ui/render.js';

        // Initialize I18n mock if needed by render
        window.I18n = {
            t: (k) => k,
            formatDate: (d, o) => new Date(d).toLocaleDateString()
        };

        async function initWidget() {
            try {
                // Fetch only overview data which contains matches
                const data = await barcaAPI.getOverview();

                if (data && data.matches) {
                    const liveMatch = data.matches.live?.[0];
                    const nextMatch = data.matches.upcoming?.[0];
                    const matchToShow = liveMatch || nextMatch;

                    // Render
                    renderNextMatch(matchToShow, !!liveMatch, data.standings);

                    // If match is live, set up simpler polling since full spa/events might be too much
                    if (liveMatch) {
                        setInterval(async () => {
                            const fresh = await barcaAPI.getOverview();
                            if (fresh?.matches?.live?.[0]) {
                                renderNextMatch(fresh.matches.live[0], true, fresh.standings);
                            }
                        }, 60000);
                    }
                }
            } catch (e) {
                console.error("Widget Error:", e);
                document.getElementById('next-match-container').innerHTML =
                    `<div class="text-center opacity-50 text-white text-xs">Offline</div>`;
            }
        }

        initWidget();
    </script>
</body>

</html>
